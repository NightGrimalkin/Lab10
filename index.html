<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite App</title>
    <script type="module" src="/src/main.js"></script>
    <link rel="stylesheet" href="./src/style.css" />
  </head>

  <body class="p-4">
    <div id="app"></div>
    <form id="tableData" class="flex flex-col">
      <label for="title">
        Tytuł:
        <input
          type="text"
          name="title"
          id="title"
          class="block border border-slate-400 rounded-md px-6"
        />
      </label>
      <label for="subtitle">
        Podtytyuł:
        <input
          type="text"
          name="subtitle"
          id="subtitle"
          class="block border border-slate-400 rounded-md px-6"
        />
      </label>
      <label for="author">
        Autor:
        <input
          type="text"
          name="author"
          id="author"
          class="block border border-slate-400 rounded-md px-6"
        />
      </label>
      <label for="content">
        Zawartość:
        <input
          type="text"
          name="content"
          id="content"
          class="block border border-slate-400 rounded-md px-6"
        />
      </label>
      <button
        class="w-sm bg-slate-400 hover:bg-slate-600 text-white font-bold py-2 px-4 rounded mt-4"
        id="addButton"
      >
        Dodaj rekord
      </button>
    </form>
  </body>
</html>
